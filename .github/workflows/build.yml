name: Build ClassIsland plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Plugin checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.*.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore QQListener.sln --locked-mode

      - name: Build release
        run: dotnet build QQListener.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet test QQListener.sln --configuration Release --no-build --no-restore --results-directory artifacts/test-results --logger trx

      - name: Verify toast samples
        run: dotnet run --project Samples/QQListener.SampleVerifier/QQListener.SampleVerifier.csproj --configuration Release --no-build --no-restore

      - name: Verify message UI
        run: dotnet run --project Samples/QQListener.UiPreview/QQListener.UiPreview.csproj --configuration Release --no-build --no-restore -- --render artifacts/ui-previews

      - name: Verify release automation
        shell: bash
        run: bash Tests/Release/run.sh

      - name: Verify PMHQ with the Windows system loader and native TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Tools/VerifyPmhqNative.ps1

      - name: Verify branch metadata
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref_type != 'tag'
        run: dotnet run --project Tools/QQListener.ReleaseVerifier/QQListener.ReleaseVerifier.csproj --configuration Release --no-build --no-restore -- --root . --configuration Release --metadata-only

      - name: Verify tagged metadata
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref_type == 'tag'
        run: dotnet run --project Tools/QQListener.ReleaseVerifier/QQListener.ReleaseVerifier.csproj --configuration Release --no-build --no-restore -- --root . --configuration Release --metadata-only --tag "$env:RELEASE_TAG"

      - name: Build CIPX
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: dotnet build QQListener.csproj --configuration Release --no-restore -p:CreateCipx=true -p:ContinuousIntegrationBuild=true -p:RuntimeBuildNumber=${{ github.run_number }}

      - name: Verify clean install package
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref_type != 'tag'
        run: dotnet run --project Tools/QQListener.ReleaseVerifier/QQListener.ReleaseVerifier.csproj --configuration Release --no-build --no-restore -- --root . --configuration Release

      - name: Verify tagged clean install package
        if: runner.os == 'Windows' && github.event_name != 'pull_request' && github.ref_type == 'tag'
        run: dotnet run --project Tools/QQListener.ReleaseVerifier/QQListener.ReleaseVerifier.csproj --configuration Release --no-build --no-restore -- --root . --configuration Release --tag "$env:RELEASE_TAG"

      - name: Verify loader bootstrap and isolated core
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: dotnet run --project Tools/QQListener.LoaderVerifier --configuration Release --no-build --no-restore -- cipx/QQListener.cipx

      - name: Upload plugin package
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QQListener-${{ github.sha }}
          if-no-files-found: error
          path: |
            cipx/QQListener.cipx
            cipx/QQListener.Download.cipx
            cipx/QQListener.Core.zip
            cipx/core-release.json
            cipx/checksums.md

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-checks-${{ matrix.os }}
          if-no-files-found: error
          path: |
            artifacts/test-results/*.trx
            artifacts/ui-previews/*.png
            artifacts/native-probe/result.txt

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified plugin package
        uses: actions/download-artifact@v4
        with:
          name: QQListener-${{ github.sha }}
          path: release

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash Tools/PublishRelease.sh release

  runtime:
    name: Publish automatic runtime build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'Sylphy-0xd3ac/QQListener'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: runtime-builds
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: QQListener-${{ github.sha }}
          path: release
      - name: Publish signed catalog and payloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
        run: bash Tools/PublishRuntime.sh release
